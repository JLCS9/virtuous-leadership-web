<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <!-- Miniatura del Test del Corazón (index /tests). Icónica, sin texto:
       corazón contorneado + degradado sutil sobre fondo beige del sitio.
       Neutra por diseño para evitar duplicar assets por idioma. -->
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#9C3A3A"/>
      <stop offset="60%" stop-color="#5A3F8B"/>
      <stop offset="100%" stop-color="#3F5A8B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#E8DFC9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bgGrad)"/>
  <!-- Corazón centrado, path cardíaco clásico -->
  <g transform="translate(200 130)">
    <path d="M 0,50
             C -60,10  -100,-30  -70,-70
             C -50,-95 -20,-90    0,-60
             C 20,-90  50,-95    70,-70
             C 100,-30 60,10     0,50 Z"
          fill="url(#heartGrad)"
          stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Reflejo sutil -->
    <path d="M -30,-50 C -20,-65 -5,-68 5,-58"
          fill="none" stroke="#FBF8F1" stroke-width="3" stroke-opacity="0.35" stroke-linecap="round"/>
  </g>
  <!-- Línea decorativa oro para consistencia con paleta -->
  <line x1="140" y1="215" x2="260" y2="215" stroke="#C5A55A" stroke-width="1.5"/>
</svg>
